name: Offres emploi Cameroun
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-job-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - name: Rechercher et envoyer les offres
        env:
          DISCORD_FERDINAND: ${{ secrets.DISCORD_FERDINAND }}
          DISCORD_YANN: ${{ secrets.DISCORD_YANN }}
        run: python bot.py
      - name: Conserver les offres envoyées
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "Update delivery history"
            git push
          fi
